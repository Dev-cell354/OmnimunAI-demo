}



/* V7 LOGO UPDATE */
.brand{display:flex;align-items:center;gap:0!important}

<body>


<div class="container">


<img src="logo-omnimun.jpg" alt="Omnimun logo" class="auth-logo">


<h1>
Create Account
</h1>


<p>
Join Omnimun AI workspace.
</p>



<div id="error"></div>



<form id="registerForm">


<label>
Username
</label>

<input 
id="username"
type="text"
placeholder="Enter username"
required>

<label>
Email Gmail
</label>

<input 
id="email"
type="email"
placeholder="your@gmail.com"
required>



<label>
Password
</label>

<input 
id="password"
type="password"
placeholder="Create password"
required>



<label>
Confirm Password
</label>

<input 
id="confirm"
type="password"
placeholder="Repeat password"
required>



<button type="submit">

Create Account

</button>


</form>



<div class="link">

Already have an account?

<a href="login.html">
Sign in
</a>


</div>


</div>



<div class="brand">

Made by Orthera

</div>




<script>


document
.getElementById("registerForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();
if(e.target.dataset.processing==='1') return;
e.target.dataset.processing='1';



const username =
document.getElementById("username").value.trim();


const email =
document.getElementById("email").value.trim();



const password =
document.getElementById("password").value.trim();



const confirm =
document.getElementById("confirm").value.trim();




if(!email.endsWith("@gmail.com")){

document.getElementById("error")
.textContent =
"Please use a Gmail address";

return;

}



if(username.length < 3){
document.getElementById("error").textContent="Username minimal 3 karakter";
return;
}

if(password.length < 8){
document.getElementById("error").textContent="Password minimal 8 karakter";
return;
}

if(password !== confirm){

document.getElementById("error")
.textContent =
"Passwords do not match";

return;

}




const res =
await fetch("/api/register",{


method:"POST",


headers:{


"Content-Type":
"application/json"


},


body:JSON.stringify({

username,

email,

password

})


});



const data = await res.json().catch(()=>({error:'Invalid server response'}));




if(data.success){

localStorage.setItem("verifyEmail",email);

window.location.href="/verify.html";


}else{


document.getElementById("error")
.textContent =
data.error || 'Unknown error';


}



});




// Security guard
const preventSpamGuard = (() => {
 let last = 0;
 return () => {
   const now = Date.now();
   if(now-last < 1200) return false;
   last = now;
   return true;
 };
})();

</script>



<script id="showPasswordToggle">
document.querySelectorAll('input[type="password"]').forEach(input=>{
 const btn=document.createElement('button'); btn.type='button';
 btn.type='button';
 btn.textContent='Show';
 btn.style.marginBottom='10px';
 btn.onclick=()=>{input.type=input.type==='password'?'text':'password';btn.textContent=input.type==='password'?'Show':'Hide';};
 input.parentNode.insertBefore(btn,input.nextSibling);
});
</script>





<script id="inputSecurity">
(() => {
 document.querySelectorAll('input,textarea').forEach(el => {
   el.addEventListener('input', () => {
     if(el.value.length > 5000){
       el.value = el.value.substring(0,5000);
     }
   });
 });
})();
</script>

<script id="network-safe">
window.addEventListener('unhandledrejection',e=>{
 console.error('Unhandled request error',e.reason);
});
</script>
</body>

</html>
